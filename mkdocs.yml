site_name: GEOG3301 GEE Labs

theme:
  name: material
  features:
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Lab 5:
      - GEE 101: lab5/gee-101.md
      - JavaScript Intro: lab5/javascript-intro.md
      - Spatial data in GEE: lab5/spatial-data-in-gee.md
      - Spatial data visualisation: lab5/spatial-data-visualisation.md
